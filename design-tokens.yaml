# ラーメン路線図マップのデザインの決まり(方向性: 駅の案内サイン風)
# 見た目を変えるときは、まずこのファイルを直してから src/styles.css の :root に同じ値を入れる
direction: 駅の案内サイン風(濃い紺の帯に白い太字、角は小さく、線ははっきり。朱色は1点だけ)
color:
  sign: "#1b2a4a"        # 帯・路線の線・文字の基本色
  sign-text: "#fff"      # 帯の上の文字
  sign-muted: "#c9d2e3"  # 帯の上の補足の文字
  sign-edge: "#55688f"   # 帯の上のボタンの枠
  sign-nav: "#a9b4ca"    # 下のタブ(選んでいない画面)
  accent: "#c94a24"      # 選んだ駅・記録するボタン(白文字と 4.68:1)
  paper: "#fff"          # カードの面
  surface: "#f3f5f8"     # ページの地
  border: "#d5d9e0"
  muted: "#5b6475"       # 補足の文字(紙の上で 4.5:1 以上)
font:
  family: Zen Kaku Gothic New(Google Fonts)
  weights: [500, 700, 900]
  title: 30px / 900
  card-title: 20px / 900
  body: 15〜16px
radius:
  default: 4px
  tag: 2px
line:
  route: 7px
  station-circle: 4px
  card-top: 6px
