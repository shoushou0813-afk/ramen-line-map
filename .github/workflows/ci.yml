name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Vite 7 の要求（20.19+ / 22.12+）に合わせる
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # 環境変数が無くてもビルド自体は通る（Supabase への接続は実行時のため）
      - run: npm run build
